# /v1/schedule/postseason
get:
  operationId: getSchedulePostseason
  summary: Retrieves postseason schedule
  description: >
    Returns the postseason schedule for a season, grouped by date like /v1/schedule.
  parameters:
    - $ref: ../components/parameters/parameters.yaml#/Season
    - $ref: ../components/parameters/parameters.yaml#/SportId
    - $ref: ../components/parameters/parameters.yaml#/TeamId
    - $ref: ../components/parameters/parameters.yaml#/GameTypes
    - $ref: ../components/parameters/parameters.yaml#/SeriesNumber
    - $ref: ../components/parameters/parameters.yaml#/Hydrate
    - $ref: ../components/parameters/parameters.yaml#/Fields
  tags:
    - Schedule
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/schemas.yaml#/Schedule
