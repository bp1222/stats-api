# /v1/awards
get:
  operationId: getAwards
  summary: List awards
  description: >
    Returns award definitions. Use an award id with GET /v1/awards/{awardId}/recipients
    to fetch recipients.
  parameters:
    - $ref: ../components/parameters/parameters.yaml#/Fields
  tags:
    - Reference
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/schemas.yaml#/AwardsListResponse
