# /v1/game/{gamePk}/contextMetrics
get:
  operationId: getGameContextMetrics
  summary: Retrieves game context metrics
  description: >
    Returns current home/away win probabilities and related context metrics for a game.
  parameters:
    - $ref: ../components/parameters/parameters.yaml#/PathGamePk
    - $ref: ../components/parameters/parameters.yaml#/Timecode
    - $ref: ../components/parameters/parameters.yaml#/Fields
  tags:
    - Games
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/schemas.yaml#/GameContextMetrics
