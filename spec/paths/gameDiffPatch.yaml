# /v1.1/game/{gamePk}/feed/live/diffPatch
get:
  operationId: getGameLiveFeedDiffPatch
  summary: Retrieves live feed JSON Patch diff
  description: >
    Returns JSON Patch operations transforming the live feed between two timecodes.
  parameters:
    - $ref: ../components/parameters/parameters.yaml#/PathGamePk
    - $ref: ../components/parameters/parameters.yaml#/StartTimecode
    - $ref: ../components/parameters/parameters.yaml#/EndTimecode
  tags:
    - Games
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/schemas.yaml#/LiveFeedDiffPatch
