get:
  operationId: getLeagueLeaderTypes
  summary: List league leader categories
  description: >
    Returns leader category display names for GET /v1/stats/leaders.
  tags:
    - Reference
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/schemas.yaml#/LeagueLeaderCategory
