# /v1/draft/{yearId}/latest
get:
  operationId: getDraftLatest
  summary: Retrieves latest draft pick
  description: >
    Returns the most recent draft pick for a year (query params are not honored).
  parameters:
    - $ref: ../components/parameters/parameters.yaml#/PathYearId
  tags:
    - Reference
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/schemas.yaml#/DraftLatestResponse
