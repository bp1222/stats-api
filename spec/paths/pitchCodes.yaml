# /v1/pitchCodes
get:
  operationId: getPitchCodes
  summary: List pitch codes
  description: >
    Returns pitch result codes (called strike, ball, foul, etc.).
  tags:
    - Reference
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/schemas.yaml#/PitchCode
