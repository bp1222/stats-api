title: Record
description: >
  Standings team record. Field presence varies by era (e.g. pre-division seasons
  often omit divisionRank and may include wildCardRank instead).
type: object
required:
  - team
  - season
  - streak
  - leagueRank
  - gamesBack
  - leagueRecord
  - wins
  - losses
properties:
  team:
    $ref: ./schemas.yaml#/Team
  season:
    type: string
  streak:
    title: Streak
    type: object
    properties:
      streakType:
        $ref: ./schemas.yaml#/StreakType
      streakCode:
        type: string
      streakNumber:
        type: number
  clinchIndicator:
    type: string
  divisionRank:
    type: string
  wildCardRank:
    type: string
    description: Seen in some historical standings responses when divisionRank is absent.
  wildCardLeader:
    type: boolean

  leagueRank:
    type: string
  sportRank:
    type: string
  gamesPlayed:
    type: number
  gamesBack:
    type: string
  wildCardGamesBack:
    type: string
  leagueGamesBack:
    type: string
  sportGamesBack:
    type: string
  springLeagueGamesBack:
    type: string
  divisionGamesBack:
    type: string
  conferenceGamesBack:
    type: string
  leagueRecord:
    $ref: ./schemas.yaml#/LeagueRecord
  lastUpdated:
    type: string
  records:
    type: object
    description: Split/overall/league/expected (and sometimes division) sub-records.
    additionalProperties: true
  runsAllowed:
    type: number
  runsScored:
    type: number
  divisionChamp:
    type: boolean
  divisionLeader:
    type: boolean
  hasWildcard:
    type: boolean
  clinched:
    type: boolean
  eliminationNumber:
    type: string
  eliminationNumberSport:
    type: string
  eliminationNumberLeague:
    type: string
  eliminationNumberDivision:
    type: string
  eliminationNumberConference:
    type: string
  wildCardEliminationNumber:
    type: string
  magicNumber:
    type: string
  wins:
    type: number
  losses:
    type: number
  runDifferential:
    type: number
  winningPercentage:
    type: string
