title: Position
description: >
  Player/fielder position. Embedded forms (e.g. primaryPosition) typically
  include code/name/type/abbreviation; GET /v1/positions returns the fuller shape.
type: object
properties:
  code:
    type: string
  name:
    type: string
  type:
    type: string
  abbreviation:
    type: string
  shortName:
    type: string
  fullName:
    type: string
  abbrev:
    type: string
  formalName:
    type: string
  displayName:
    type: string
  pitcher:
    type: boolean
  gamePosition:
    type: boolean
  fielder:
    type: boolean
  outfield:
    type: boolean
