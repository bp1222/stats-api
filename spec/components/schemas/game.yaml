title: Game
description: >
  Game Thing
type: object
required:
  - gamePk
  - gameGuid
  - gameType
  - season
  - gameDate
  - officialDate
  - status
  - teams
properties:
  gamePk:
    type: number
  gameGuid:
    type: string
  link:
    type: string
  gameType:
    $ref: ./schemas.yaml#/GameType
  season:
    type: string
  gameDate:
    type: string
  officialDate:
    type: string
  rescheduledTo:
    type: string
  rescheduledToDate:
    type: string
  rescheduledFrom:
    type: string
  rescheduledFromDate:
    type: string
  status:
    title: GameStatus
    type: object
    properties:
      abstractGameState:
        type: string
      codedGameState:
        $ref: ./schemas.yaml#/GameStatusCode
      detailedState:
        type: string
      statusCode:
        type: string
      startTimeTBD:
        type: boolean
      reason:
        description: Delay/suspension reason when present (e.g. Rain). Often paired with statusCode IR.
        type: string
      abstractGameCode:
        type: string
  teams:
    title: GameTeams
    type: object
    required:
      - away
      - home
    properties:
      away:
        $ref: ./schemas.yaml#/GameTeam
      home:
        $ref: ./schemas.yaml#/GameTeam
  venue:
    $ref: ./schemas.yaml#/Venue
  content:
    $ref: ./schemas.yaml#/Content
  isTie:
    type: boolean
  isFeaturedGame:
    type: boolean
  gameNumber:
    type: number
  publicFacing:
    type: boolean 
  doubleHeader:
    type: string # enum?
  gamedayType:
    type: string # enum?
  tiebreaker:
    type: string # enum?
  calendarEventID:
    type: string
  seasonDisplay:
    type: string
  dayNight:
    type: string # enum?
  description:
    type: string
  scheduledInnings:
    type: number 
  reverseHomeAwayStatus:
    type: boolean 
  inningBreakLength:
    type: number 
  gamesInSeries:
    type: number 
  seriesGameNumber:
    type: number
  seriesDescription:
    type: string
  recordSource:
    type: string # enum
  ifNecessary:
    type: string # enum
  ifNecessaryDescription:
    type: string
  gameId:
    type: string
  linescore:
    description: Present when schedule is hydrated with linescore.
    $ref: ./schemas.yaml#/Linescore
  decisions:
    title: ScheduleGameDecisions
    description: Present when schedule is hydrated with decisions (finals).
    type: object
    properties:
      winner:
        $ref: ./schemas.yaml#/Person
      loser:
        $ref: ./schemas.yaml#/Person
      save:
        $ref: ./schemas.yaml#/Person
