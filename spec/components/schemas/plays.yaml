title: Plays
description: >
  Play-by-play data for a game.
type: object
properties:
  allPlays:
    type: array
    items:
      title: Play
      type: object
      properties:
        result:
          title: PlayResult
          type: object
          properties:
            type:
              type: string
            event:
              type: string
            eventType:
              type: string
            description:
              type: string
            rbi:
              type: number
            awayScore:
              type: number
            homeScore:
              type: number
            isOut:
              type: boolean
        about:
          title: PlayAbout
          type: object
          properties:
            atBatIndex:
              type: number
            halfInning:
              type: string
            isTopInning:
              type: boolean
            inning:
              type: number
            startTime:
              type: string
            endTime:
              type: string
            isComplete:
              type: boolean
            isScoringPlay:
              type: boolean
            hasReview:
              type: boolean
            hasOut:
              type: boolean
            captivatingIndex:
              type: number
        count:
          title: PlayCount
          type: object
          properties:
            balls:
              type: number
            strikes:
              type: number
            outs:
              type: number
        matchup:
          title: PlayMatchup
          type: object
          properties:
            batter:
              $ref: ./schemas.yaml#/Person
            batSide:
              $ref: ./schemas.yaml#/BatSide
            pitcher:
              $ref: ./schemas.yaml#/Person
            pitchHand:
              $ref: ./schemas.yaml#/PitchHand
            batterHotColdZones:
              type: array
              items:
                type: object
            pitcherHotColdZones:
              type: array
              items:
                type: object
            batterHotColdZoneStats:
              type: object
              additionalProperties: true
            postOnFirst:
              $ref: ./schemas.yaml#/Person
            postOnSecond:
              $ref: ./schemas.yaml#/Person
            postOnThird:
              $ref: ./schemas.yaml#/Person
            splits:
              title: PlayMatchupSplits
              type: object
              properties:
                batter:
                  type: string
                pitcher:
                  type: string
                menOnBase:
                  type: string
        atBatIndex:
          type: number
        playEndTime:
          type: string
        pitchIndex:
          type: array
          items:
            type: number
        actionIndex:
          type: array
          items:
            type: number
        runnerIndex:
          type: array
          items:
            type: number
        runners:
          type: array
          items:
            title: PlayRunner
            type: object
            properties:
              movement:
                type: object
                properties:
                  originBase:
                    type: string
                  start:
                    type: string
                  end:
                    type: string
                  outBase:
                    type: string
                  isOut:
                    type: boolean
                  outNumber:
                    type: number
              details:
                type: object
                properties:
                  event:
                    type: string
                  eventType:
                    type: string
                  movementReason:
                    type: string
                  runner:
                    $ref: ./schemas.yaml#/Person
                  responsiblePitcher:
                    $ref: ./schemas.yaml#/Person
                  isScoringEvent:
                    type: boolean
                  rbi:
                    type: boolean
                  earned:
                    type: boolean
                  teamUnearned:
                    type: boolean
                  playIndex:
                    type: number
              credits:
                type: array
                items:
                  title: PlayRunnerCredit
                  type: object
                  properties:
                    player:
                      type: object
                      properties:
                        id:
                          type: number
                        link:
                          type: string
                    position:
                      $ref: ./schemas.yaml#/Position
                    credit:
                      type: string
        playEvents:
          type: array
          items:
            title: PlayEvent
            type: object
            properties:
              details:
                type: object
                additionalProperties: true
              count:
                type: object
                additionalProperties: true
              index:
                type: number
              startTime:
                type: string
              endTime:
                type: string
              isPitch:
                type: boolean
              type:
                type: string
              playId:
                type: string
              pitchNumber:
                type: number
              pfxId:
                type: string
              pitchData:
                type: object
                description: Pitch tracking metrics; key set varies by pitch/era.
                additionalProperties: true
              hitData:
                type: object
                description: Batted-ball metrics when the ball is put in play.
                additionalProperties: true
              actionPlayId:
                type: string
              isBaseRunningPlay:
                type: boolean
              isSubstitution:
                type: boolean
              battingOrder:
                type: string
              player:
                type: object
                properties:
                  id:
                    type: number
                  link:
                    type: string
              position:
                $ref: ./schemas.yaml#/Position
              replacedPlayer:
                type: object
                properties:
                  id:
                    type: number
                  link:
                    type: string
              reviewDetails:
                type: object
                additionalProperties: true
  currentPlay:
    description: Same shape as an allPlays entry; present during/after the game.
    # Inline duplicate of Play title above is not referenceable; keep object pass-through
    # until Play is extracted. Prefer allPlays typing; currentPlay preserves raw keys today.
    type: object
    additionalProperties: true
  scoringPlays:
    type: array
    items:
      type: number
  playsByInning:
    type: array
    items:
      type: object
      additionalProperties: true
